# Bí mật của hub. Chép thành ~/.uet-arena/secrets.toml hoặc đặt ARENA_SECRETS=<đường dẫn>.
# KHÔNG commit file thật. Chỉ cặp tên = "giá trị"; mọi giá trị dưới đây là giả.

