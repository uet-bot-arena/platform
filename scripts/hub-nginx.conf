worker_processes 1;
pid /run/uet-arena-nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
    include /etc/uet-arena/nginx-read-upstream.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format arena '$remote_addr - "$request" $status $body_bytes_sent';
    access_log syslog:server=unix:/dev/log,tag=uet_arena_nginx,nohostname arena;
    client_body_temp_path /run/uet-arena-nginx/body;
    proxy_temp_path /run/uet-arena-nginx/proxy;
    fastcgi_temp_path /run/uet-arena-nginx/fastcgi;
    uwsgi_temp_path /run/uet-arena-nginx/uwsgi;
    scgi_temp_path /run/uet-arena-nginx/scgi;
    client_max_body_size 17m;
    sendfile on;
    etag on;
    map $uri $arena_csv {
        default "";
        ~\.csv$ 'attachment; filename="standings.csv"';
    }
    server {
        listen 127.0.0.1:4181;
        include /etc/uet-arena/nginx-security.conf;
        add_header Cache-Control no-store always;
        location = / {
            root /opt/uet-arena/app/uet-bot-arena/dist/live;
            try_files /index.html =404;
            default_type text/html;
        }
        location /_ui/ {
            alias /opt/uet-arena/app/uet-bot-arena/dist/live/;
            autoindex off;
        }
        location = /assets/favicon.svg {
            alias /opt/uet-arena/app/uet-bot-arena/dist/assets/favicon.svg;
        }
        location ~ "^/snapshots/((competitions|queue|featured|announcements)\.json|(competitions|fixtures)/[A-Za-z0-9_-]{1,100}\.json|standings/[A-Za-z0-9_-]{1,100}\.(json|csv)|(standings|fixtures)/[A-Za-z0-9_-]{1,100}/[A-Za-z0-9_-]{1,100}\.json)$" {
            root /var/lib/uet-arena/data;
            gzip_static always;
            gunzip on;
            include /etc/uet-arena/nginx-security.conf;
            add_header Cache-Control 'public, max-age=1, s-maxage=5' always;
            add_header Vary Accept-Encoding always;
            add_header Content-Disposition $arena_csv;
        }
        location /snapshots/ { return 404; }
        # Grader install package built by install-hub.sh; the file name carries its SHA-256 prefix.
        location ~ "^/downloads/uet-arena-grader-[0-9a-f]{12}\.zip(\.sha256)?$" {
            root /opt/uet-arena;
            include /etc/uet-arena/nginx-security.conf;
            add_header Cache-Control 'public, max-age=86400' always;
        }
        # Linux grader rootfs published with install-hub.sh --grader-rootfs; name carries the full SHA-256.
        location ~ "^/downloads/rootfs-[0-9a-f]{64}\.tar\.zst(\.sha256)?$" {
            root /opt/uet-arena;
            default_type application/octet-stream;
            include /etc/uet-arena/nginx-security.conf;
            add_header Cache-Control 'public, max-age=86400' always;
        }
        location = /downloads/grader-latest.json {
            root /opt/uet-arena;
            default_type application/json;
            include /etc/uet-arena/nginx-security.conf;
            add_header Cache-Control no-cache always;
        }
        location /downloads/ { return 404; }
        include /etc/uet-arena/nginx-read-routes.conf;
        location / {
            proxy_pass http://127.0.0.1:4182;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 75s;
        }
    }
}
